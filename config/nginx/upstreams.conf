# FONCIER+ — Upstreams microservices
# Chaque upstream pointe vers le service Docker interne correspondant.

upstream upstream_frontend {
    least_conn;
    server frontend:80 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream upstream_dar {
    least_conn;
    server svc-dar:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream upstream_parcel {
    least_conn;
    server svc-parcel:8000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream upstream_legal {
    least_conn;
    server svc-legal:8000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream upstream_workflow {
    least_conn;
    server svc-workflow:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream upstream_alert {
    least_conn;
    server svc-alert:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream upstream_conflict {
    least_conn;
    server svc-conflict:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream upstream_audit {
    least_conn;
    server svc-audit:8000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream upstream_cert {
    least_conn;
    server svc-cert:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}
