# Nginx pour servir le frontend React (SPA)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /health { return 200 '{"ok":true}'; add_header Content-Type application/json; }

    # SPA fallback — React Router gère les routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressif pour assets Vite (hashed filenames)
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
