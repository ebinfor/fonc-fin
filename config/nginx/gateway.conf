# FONCIER+ v1.0.9 — API Gateway Nginx
# =====================================
# Auth JWT centralisée + Routage vers microservices + Rate limiting
# Toutes les règles métier restent dans les services en aval.

user nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logs JSON pour ELK/Grafana ──────────────────────────────
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"upstream":"$upstream_addr",'
        '"duration":$request_time,'
        '"user_agent":"$http_user_agent",'
        '"x_request_id":"$http_x_request_id",'
        '"x_forwarded_for":"$http_x_forwarded_for"'
        '}';
    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ─────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    gzip            on;
    gzip_types      application/json text/plain application/xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    server_tokens   off;

    # ── Timeouts ────────────────────────────────────────────────
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # ── Buffers ─────────────────────────────────────────────────
    proxy_buffer_size          16k;
    proxy_buffers              8 16k;
    proxy_busy_buffers_size    32k;

    # ── Rate limiting zones ─────────────────────────────────────
    # Zone globale : 100 req/s par IP
    limit_req_zone $binary_remote_addr zone=api_global:20m   rate=100r/s;
    # Zone auth : 5 req/min par IP (anti-brute-force)
    limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=5r/m;
    # Zone CCFM public (vérification NUS) : 30 req/min
    limit_req_zone $binary_remote_addr zone=api_verify:10m   rate=30r/m;

    # ── Upstreams microservices ─────────────────────────────────
    include /etc/nginx/conf.d/upstreams.conf;

    # ── Headers de sécurité communs ─────────────────────────────
    map $upstream_addr $service_name {
        ~svc-dar       "dar";
        ~svc-parcel    "parcel";
        ~svc-legal     "legal";
        ~svc-workflow  "workflow";
        ~svc-alert     "alert";
        ~svc-conflict  "conflict";
        ~svc-audit     "audit";
        ~svc-cert      "cert";
        default        "gateway";
    }

    # ── Redirect HTTP → HTTPS ───────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Serveur HTTPS principal ──────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name foncier.gov.ne www.foncier.gov.ne;

        # TLS
        ssl_certificate     /etc/nginx/ssl/foncier.gov.ne.crt;
        ssl_certificate_key /etc/nginx/ssl/foncier.gov.ne.key;
        ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # Headers sécurité
        add_header X-Frame-Options             DENY always;
        add_header X-Content-Type-Options      nosniff always;
        add_header X-XSS-Protection            "1; mode=block" always;
        add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Service-Name              $service_name always;
        add_header X-Request-ID                $http_x_request_id always;
        add_header Content-Security-Policy     "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://sentry.io" always;

        # ── Frontend React ────────────────────────────────────────
        location / {
            proxy_pass http://upstream_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Healthcheck Gateway ──────────────────────────────────
        location = /gateway/health {
            access_log off;
            return 200 '{"status":"ok","version":"1.0.9"}';
            add_header Content-Type application/json;
        }

        # ── AUTH : /v1/auth/* → svc-cert (JWT issuer) ────────────
        location ~ ^/v1/auth/ {
            limit_req zone=api_auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://upstream_cert;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # ── PORTAIL PUBLIC : /verify/* → svc-cert ────────────────
        location ~ ^/verify/ {
            limit_req zone=api_verify burst=20 nodelay;
            proxy_pass http://upstream_cert;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # ── DAR + WF30 → svc-dar ─────────────────────────────────
        location ~ ^/v1/(annf|wf30)/ {
            limit_req zone=api_global burst=50 nodelay;
            proxy_pass http://upstream_dar;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # ── PARCEL SIG → svc-parcel ──────────────────────────────
        location ~ ^/v1/(bgu|cadastre|rnp|droits)/ {
            limit_req zone=api_global burst=100 nodelay;
            proxy_pass http://upstream_parcel;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # ── LEGAL → svc-legal ────────────────────────────────────
        location ~ ^/v1/(rnaf|jo|notaire|domaine|commune|urbanisme|banque)/ {
            limit_req zone=api_global burst=100 nodelay;
            proxy_pass http://upstream_legal;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # ── WORKFLOW ENGINE 30 → svc-workflow ────────────────────
        location ~ ^/v1/(workflows|espace)/ {
            limit_req zone=api_global burst=50 nodelay;
            proxy_pass http://upstream_workflow;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # ── ALERT + MONITORING → svc-alert ───────────────────────
        location ~ ^/api/v1/(monitoring|risk|dashboard)/ {
            limit_req zone=api_global burst=60 nodelay;
            proxy_pass http://upstream_alert;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # ── CONFLICT + JUSTICE → svc-conflict ────────────────────
        location ~ ^/v1/justice/ {
            limit_req zone=api_global burst=50 nodelay;
            proxy_pass http://upstream_conflict;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # ── AUDIT + ADMIN → svc-audit ────────────────────────────
        location ~ ^/v1/admin/ {
            limit_req zone=api_global burst=30 nodelay;
            proxy_pass http://upstream_audit;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # ── CERTIFICATION CCFM → svc-cert ────────────────────────
        location ~ ^/(v1/ccfm|api/v3/ccfm|v1/users)/ {
            limit_req zone=api_global burst=80 nodelay;
            proxy_pass http://upstream_cert;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # ── 404 ───────────────────────────────────────────────────
        error_page 404 = @not_found;
        location @not_found {
            return 404 '{"error":"Route inconnue","code":"NOT_FOUND"}';
            add_header Content-Type application/json;
        }

        # ── 429 ───────────────────────────────────────────────────
        error_page 429 = @rate_limited;
        location @rate_limited {
            return 429 '{"error":"Trop de requêtes","code":"RATE_LIMIT_EXCEEDED","retry_after":60}';
            add_header Content-Type application/json;
            add_header Retry-After 60;
        }

        # ── 502/503 ───────────────────────────────────────────────
        error_page 502 503 504 = @service_unavailable;
        location @service_unavailable {
            return 503 '{"error":"Service temporairement indisponible","code":"SERVICE_UNAVAILABLE"}';
            add_header Content-Type application/json;
        }
    }
}
