[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = --strict-markers --tb=short -ra
markers =
    asyncio: async tests
    antifraud: antifraude demonstrations
    rbac: permission matrix
    e2e: end-to-end HTTP
    unit: unit tests
filterwarnings =
    ignore::DeprecationWarning
